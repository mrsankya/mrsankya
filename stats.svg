<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 200" width="100%" height="100%">
  <defs>
    <linearGradient id="stat-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15182a"/>
      <stop offset="100%" stop-color="#0b0d19"/>
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600&amp;family=Outfit:wght@600;800&amp;display=swap');
    text { font-family: 'Outfit', sans-serif; }
    .mono { font-family: 'Fira Code', monospace; }
  </style>

  <rect width="490" height="200" rx="16" fill="url(#stat-bg)" stroke="#2a2e4a" stroke-width="1.5"/>

  <!-- Left S+ Rank Ring -->
  <g transform="translate(75, 100)">
    <circle r="55" fill="none" stroke="#252945" stroke-width="10"/>
    <circle r="55" fill="none" stroke="url(#ring-grad)" stroke-width="10" stroke-dasharray="345" stroke-dashoffset="50" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="345;50" dur="2s" ease="ease-out"/>
    </circle>
    <text y="-5" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">S+</text>
    <text y="18" font-size="11" font-weight="800" fill="#00f2fe" text-anchor="middle" letter-spacing="1">RANK</text>
  </g>

  <!-- Right Stat Rows -->
  <g transform="translate(175, 35)">
    <text font-size="16" font-weight="800" fill="#ff2a85" letter-spacing="1">GITHUB PERFORMANCE</text>

    <!-- Row 1: Total Commits -->
    <g transform="translate(0, 30)">
      <text font-size="13" fill="#cbd5e1">Total Commits (2026):</text>
      <text x="250" font-size="14" font-weight="700" fill="#00f2fe" class="mono" text-anchor="end">480+</text>
      <rect y="10" width="250" height="6" rx="3" fill="#252945"/>
      <rect y="10" width="210" height="6" rx="3" fill="#00f2fe"/>
    </g>

    <!-- Row 2: Pull Requests -->
    <g transform="translate(0, 65)">
      <text font-size="13" fill="#cbd5e1">Pull Requests &amp; Issues:</text>
      <text x="250" font-size="14" font-weight="700" fill="#ff2a85" class="mono" text-anchor="end">65+</text>
      <rect y="10" width="250" height="6" rx="3" fill="#252945"/>
      <rect y="10" width="180" height="6" rx="3" fill="#ff2a85"/>
    </g>

    <!-- Row 3: Contributed Repos -->
    <g transform="translate(0, 100)">
      <text font-size="13" fill="#cbd5e1">Contributed Repositories:</text>
      <text x="250" font-size="14" font-weight="700" fill="#facc15" class="mono" text-anchor="end">25+</text>
      <rect y="10" width="250" height="6" rx="3" fill="#252945"/>
      <rect y="10" width="195" height="6" rx="3" fill="#facc15"/>
    </g>
  </g>
</svg>