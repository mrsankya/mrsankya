<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 200" width="100%" height="100%">
  <defs>
    <linearGradient id="statBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18132b"/>
      <stop offset="100%" stop-color="#120f1e"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b9a6ff"/>
      <stop offset="100%" stop-color="#6ee7f5"/>
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600&amp;family=Outfit:wght@600;800&amp;display=swap');
    text { font-family: 'Outfit', sans-serif; }
    .mono { font-family: 'Fira Code', monospace; }
  </style>

  <rect width="490" height="200" rx="16" fill="url(#statBg)" stroke="#2e254d" stroke-width="1.5"/>

  <!-- Left Ring -->
  <g transform="translate(75, 100)">
    <circle r="55" fill="none" stroke="#251d42" stroke-width="10"/>
    <circle r="55" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-dasharray="345" stroke-dashoffset="50">
      <animate attributeName="stroke-dashoffset" values="345;50" dur="2s" ease="ease-out"/>
    </circle>
    <text y="-5" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">S+</text>
    <text y="18" font-size="11" font-weight="800" fill="#6ee7f5" text-anchor="middle" letter-spacing="1">RANK</text>
  </g>

  <!-- Right Rows -->
  <g transform="translate(175, 35)">
    <text font-size="16" font-weight="800" fill="#b9a6ff" letter-spacing="1">GITHUB STATS</text>

    <g transform="translate(0, 30)">
      <text font-size="13" fill="#cbd5e1">Total Commits (2026):</text>
      <text x="250" font-size="14" font-weight="700" fill="#6ee7f5" class="mono" text-anchor="end">520+</text>
      <rect y="10" width="250" height="6" rx="3" fill="#251d42"/>
      <rect y="10" width="215" height="6" rx="3" fill="#6ee7f5"/>
    </g>

    <g transform="translate(0, 65)">
      <text font-size="13" fill="#cbd5e1">Pull Requests &amp; Issues:</text>
      <text x="250" font-size="14" font-weight="700" fill="#b9a6ff" class="mono" text-anchor="end">75+</text>
      <rect y="10" width="250" height="6" rx="3" fill="#251d42"/>
      <rect y="10" width="185" height="6" rx="3" fill="#b9a6ff"/>
    </g>

    <g transform="translate(0, 100)">
      <text font-size="13" fill="#cbd5e1">Contributed Repositories:</text>
      <text x="250" font-size="14" font-weight="700" fill="#facc15" class="mono" text-anchor="end">30+</text>
      <rect y="10" width="250" height="6" rx="3" fill="#251d42"/>
      <rect y="10" width="200" height="6" rx="3" fill="#facc15"/>
    </g>
  </g>
</svg>