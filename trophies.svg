<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 320" width="100%" height="100%">
  <defs>
    <linearGradient id="trophyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18132b"/>
      <stop offset="100%" stop-color="#120f1e"/>
    </linearGradient>

    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&amp;display=swap');
    text { font-family: 'Outfit', sans-serif; }
    
    .trophy-card {
      transition: transform 0.3s ease;
      cursor: pointer;
    }
    .trophy-card:hover {
      transform: translateY(-4px);
    }
  </style>

  <!-- Card Background -->
  <rect width="490" height="320" rx="18" fill="url(#trophyBg)" stroke="#2e254d" stroke-width="1.5"/>

  <!-- Title Header -->
  <text x="30" y="36" font-size="16" font-weight="800" fill="#b9a6ff" letter-spacing="1">ACHIEVEMENTS &amp; GITHUB TROPHIES</text>

  <!-- ==================== ROW 1 ==================== -->
  <g transform="translate(25, 55)">
    <!-- Trophy 1: Commits -->
    <g transform="translate(0, 0)" class="trophy-card">
      <rect width="100" height="115" rx="12" fill="#251d42" stroke="#facc15" stroke-width="1.5"/>
      <text x="50" y="42" font-size="30" text-anchor="middle">🏆</text>
      <text x="50" y="72" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">Commits</text>
      <text x="50" y="92" font-size="10" font-weight="700" fill="#facc15" text-anchor="middle">MASTER</text>
    </g>

    <!-- Trophy 2: Full-Stack -->
    <g transform="translate(115, 0)" class="trophy-card">
      <rect width="100" height="115" rx="12" fill="#251d42" stroke="#6ee7f5" stroke-width="1.5"/>
      <text x="50" y="42" font-size="30" text-anchor="middle">🚀</text>
      <text x="50" y="72" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">Full-Stack</text>
      <text x="50" y="92" font-size="10" font-weight="700" fill="#6ee7f5" text-anchor="middle">EXPERT</text>
    </g>

    <!-- Trophy 3: Polyglot -->
    <g transform="translate(230, 0)" class="trophy-card">
      <rect width="100" height="115" rx="12" fill="#251d42" stroke="#b9a6ff" stroke-width="1.5"/>
      <text x="50" y="42" font-size="30" text-anchor="middle">⚡</text>
      <text x="50" y="72" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">Polyglot</text>
      <text x="50" y="92" font-size="10" font-weight="700" fill="#b9a6ff" text-anchor="middle">SPECIALIST</text>
    </g>

    <!-- Trophy 4: AI Pioneer -->
    <g transform="translate(345, 0)" class="trophy-card">
      <rect width="95" height="115" rx="12" fill="#251d42" stroke="#f472b6" stroke-width="1.5"/>
      <text x="47" y="42" font-size="30" text-anchor="middle">🤖</text>
      <text x="47" y="72" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">AI Creator</text>
      <text x="47" y="92" font-size="10" font-weight="700" fill="#f472b6" text-anchor="middle">PIONEER</text>
    </g>
  </g>

  <!-- ==================== ROW 2 ==================== -->
  <g transform="translate(25, 185)">
    <!-- Trophy 5: Star Hunter -->
    <g transform="translate(0, 0)" class="trophy-card">
      <rect width="100" height="115" rx="12" fill="#251d42" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="50" y="42" font-size="30" text-anchor="middle">🌟</text>
      <text x="50" y="72" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">Star Hunter</text>
      <text x="50" y="92" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">CHAMPION</text>
    </g>

    <!-- Trophy 6: PR Architect -->
    <g transform="translate(115, 0)" class="trophy-card">
      <rect width="100" height="115" rx="12" fill="#251d42" stroke="#4ade80" stroke-width="1.5"/>
      <text x="50" y="42" font-size="30" text-anchor="middle">🛠️</text>
      <text x="50" y="72" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">PR Architect</text>
      <text x="50" y="92" font-size="10" font-weight="700" fill="#4ade80" text-anchor="middle">NINJA</text>
    </g>

    <!-- Trophy 7: Web Maestro -->
    <g transform="translate(230, 0)" class="trophy-card">
      <rect width="100" height="115" rx="12" fill="#251d42" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="50" y="42" font-size="30" text-anchor="middle">🌐</text>
      <text x="50" y="72" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">Web Maestro</text>
      <text x="50" y="92" font-size="10" font-weight="700" fill="#a78bfa" text-anchor="middle">INNOVATOR</text>
    </g>

    <!-- Trophy 8: Clean Code -->
    <g transform="translate(345, 0)" class="trophy-card">
      <rect width="95" height="115" rx="12" fill="#251d42" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="47" y="42" font-size="30" text-anchor="middle">🎯</text>
      <text x="47" y="72" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">Clean Code</text>
      <text x="47" y="92" font-size="10" font-weight="700" fill="#f43f5e" text-anchor="middle">LEGEND</text>
    </g>
  </g>
</svg>