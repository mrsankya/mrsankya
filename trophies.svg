<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fff2b0"/><stop offset="100%" stop-color="#e8a318"/>
  </linearGradient>
  <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f4f6fa"/><stop offset="100%" stop-color="#b9c2d4"/>
  </linearGradient>
  <linearGradient id="bronze" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#e6b089"/><stop offset="100%" stop-color="#a9612f"/>
  </linearGradient>
  <linearGradient id="neon1" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#00f0ff"/><stop offset="100%" stop-color="#7b2ff7"/>
  </linearGradient>
  <linearGradient id="neon2" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ff2ec4"/><stop offset="100%" stop-color="#7b2ff7"/>
  </linearGradient>
  <filter id="trophyGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .mono { font-family:'Cascadia Code','Fira Code','Consolas',monospace; }
    .sans { font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .card { animation: rise 0.6s ease forwards; opacity:0; }
    @keyframes rise { from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
    .t1{animation-delay:0.1s;} .t2{animation-delay:0.25s;} .t3{animation-delay:0.4s;}
    .t4{animation-delay:0.55s;} .t5{animation-delay:0.7s;} .t6{animation-delay:0.85s;}
    .glow-pulse { animation: gp 2.4s ease-in-out infinite; }
    @keyframes gp { 0%,100%{ filter:url(#trophyGlow); opacity:1;} 50%{ filter:none; opacity:0.85;} }
    .spin-slow { transform-origin:center; animation: spinS 6s linear infinite; }
    @keyframes spinS { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  </style>
</defs>

<rect width="900" height="220" rx="16" fill="#0a0e17" stroke="#2a3a5c" stroke-width="1.5"/>
<text x="24" y="32" class="sans" font-size="16" font-weight="700" fill="#f3f6ff">GitHub Trophies</text>
<line x1="24" y1="44" x2="876" y2="44" stroke="#1c2740" stroke-width="1"/>

<!-- Trophy card template repeated -->
<g transform="translate(40,60)">
  <!-- Card 1: Stars -->
  <g class="card t1">
    <rect width="120" height="140" rx="12" fill="#0f1524" stroke="#2a3a5c" stroke-width="1.2"/>
    <g transform="translate(60,52)" class="glow-pulse">
      <path d="M0,-26 L7,-8 L26,-8 L11,4 L17,22 L0,10 L-17,22 L-11,4 L-26,-8 L-7,-8 Z" fill="url(#gold)"/>
    </g>
    <text x="60" y="98" text-anchor="middle" class="mono" font-size="11" fill="#8fa2c9">STARS</text>
    <text x="60" y="120" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#fff2b0">1.2K</text>
  </g>

  <!-- Card 2: Commits -->
  <g class="card t2" transform="translate(135,0)">
    <rect width="120" height="140" rx="12" fill="#0f1524" stroke="#2a3a5c" stroke-width="1.2"/>
    <g transform="translate(60,52)" class="glow-pulse">
      <circle r="18" fill="none" stroke="url(#neon1)" stroke-width="5"/>
      <circle r="4" fill="url(#neon1)"/>
    </g>
    <text x="60" y="98" text-anchor="middle" class="mono" font-size="11" fill="#8fa2c9">COMMITS</text>
    <text x="60" y="120" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#7fe9ff">3.8K</text>
  </g>

  <!-- Card 3: Pull Shark -->
  <g class="card t3" transform="translate(270,0)">
    <rect width="120" height="140" rx="12" fill="#0f1524" stroke="#2a3a5c" stroke-width="1.2"/>
    <g transform="translate(60,52)" class="glow-pulse">
      <path d="M-20,0 L20,0 M12,-8 L20,0 L12,8" fill="none" stroke="url(#neon2)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="60" y="98" text-anchor="middle" class="mono" font-size="11" fill="#8fa2c9">PULL SHARK</text>
    <text x="60" y="120" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#ff9fe6">186</text>
  </g>

  <!-- Card 4: Issues -->
  <g class="card t4" transform="translate(405,0)">
    <rect width="120" height="140" rx="12" fill="#0f1524" stroke="#2a3a5c" stroke-width="1.2"/>
    <g transform="translate(60,52)" class="glow-pulse">
      <circle r="18" fill="none" stroke="url(#gold)" stroke-width="5"/>
      <path d="M0,-8 L0,4 M0,10 L0,11" stroke="#0a0e17" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="60" y="98" text-anchor="middle" class="mono" font-size="11" fill="#8fa2c9">ISSUES</text>
    <text x="60" y="120" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#fff2b0">97</text>
  </g>

  <!-- Card 5: Repos -->
  <g class="card t5" transform="translate(540,0)">
    <rect width="120" height="140" rx="12" fill="#0f1524" stroke="#2a3a5c" stroke-width="1.2"/>
    <g transform="translate(60,52)" class="glow-pulse">
      <rect x="-16" y="-14" width="32" height="26" rx="4" fill="none" stroke="url(#silver)" stroke-width="4"/>
      <line x1="-16" y1="-4" x2="16" y2="-4" stroke="url(#silver)" stroke-width="3"/>
    </g>
    <text x="60" y="98" text-anchor="middle" class="mono" font-size="11" fill="#8fa2c9">REPOS</text>
    <text x="60" y="120" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#f4f6fa">42</text>
  </g>

  <!-- Card 6: Followers -->
  <g class="card t6" transform="translate(675,0)">
    <rect width="120" height="140" rx="12" fill="#0f1524" stroke="#2a3a5c" stroke-width="1.2"/>
    <g transform="translate(60,52)" class="glow-pulse spin-slow">
      <circle r="18" fill="none" stroke="url(#bronze)" stroke-width="5" stroke-dasharray="6 6"/>
    </g>
    <text x="60" y="98" text-anchor="middle" class="mono" font-size="11" fill="#8fa2c9">FOLLOWERS</text>
    <text x="60" y="120" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#e6b089">310</text>
  </g>
</g>
</svg>
