<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 200" width="100%" height="100%">
  <defs>
    <linearGradient id="trophy-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15182a"/>
      <stop offset="100%" stop-color="#0b0d19"/>
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&amp;display=swap');
    text { font-family: 'Outfit', sans-serif; }
  </style>

  <rect width="490" height="200" rx="16" fill="url(#trophy-bg)" stroke="#2a2e4a" stroke-width="1.5"/>

  <text x="30" y="35" font-size="16" font-weight="800" fill="#facc15" letter-spacing="1">ACHIEVEMENTS &amp; TROPHIES</text>

  <g transform="translate(25, 55)">
    <g transform="translate(0, 0)">
      <rect width="100" height="120" rx="12" fill="#1e243b" stroke="#facc15" stroke-width="1"/>
      <text x="50" y="45" font-size="32" text-anchor="middle">🏆</text>
      <text x="50" y="75" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">Commits</text>
      <text x="50" y="95" font-size="10" font-weight="700" fill="#facc15" text-anchor="middle">MASTER</text>
    </g>

    <g transform="translate(115, 0)">
      <rect width="100" height="120" rx="12" fill="#1e243b" stroke="#00f2fe" stroke-width="1"/>
      <text x="50" y="45" font-size="32" text-anchor="middle">🚀</text>
      <text x="50" y="75" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">Full-Stack</text>
      <text x="50" y="95" font-size="10" font-weight="700" fill="#00f2fe" text-anchor="middle">EXPERT</text>
    </g>

    <g transform="translate(230, 0)">
      <rect width="100" height="120" rx="12" fill="#1e243b" stroke="#ff2a85" stroke-width="1"/>
      <text x="50" y="45" font-size="32" text-anchor="middle">⚡</text>
      <text x="50" y="75" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">Polyglot</text>
      <text x="50" y="95" font-size="10" font-weight="700" fill="#ff2a85" text-anchor="middle">SPECIALIST</text>
    </g>

    <g transform="translate(345, 0)">
      <rect width="95" height="120" rx="12" fill="#1e243b" stroke="#a78bfa" stroke-width="1"/>
      <text x="47" y="45" font-size="32" text-anchor="middle">🤖</text>
      <text x="47" y="75" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">AI Creator</text>
      <text x="47" y="95" font-size="10" font-weight="700" fill="#a78bfa" text-anchor="middle">PIONEER</text>
